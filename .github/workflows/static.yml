
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    # Automatically deploy only when YOU pushed.
    # workflow_dispatch always allows a manual deployment.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'SlickFromMars'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate campaign JSON
        run: python scripts/validate-json.py

      - name: Generate portrait manifests
        shell: bash
        run: |
          set -e

          for campaign_file in campaigns/*/campaign.json; do
            if [[ ! -f "$campaign_file" ]]; then
              continue
            fi

            campaign_dir="$(dirname "$campaign_file")"
            campaign_id="$(basename "$campaign_dir")"

            echo "Generating portrait manifest: $campaign_id"
            python scripts/generate-portrait-manifest.py "$campaign_id"
          done

      - name: Generate campaign share pages
        run: python scripts/generate-share-pages.py

      - name: Prepare deployment
        run: |
          mkdir deploy

          cp index.html deploy/
          cp 404.html deploy/

          cp -r campaigns deploy/
          cp -r css deploy/
          cp -r js deploy/
          cp -r arg deploy/
          cp -r share deploy/

          touch deploy/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
