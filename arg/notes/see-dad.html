<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recovered Record</title>

    <link rel="stylesheet" href="../css/note.css">
</head>

<body>

    <main class="document-viewer">

        <a href="../index.html" class="back-button">
            &lt; RETURN TO ARCHIVE
        </a>


        <header class="document-header">

            <div class="classification">
                RECOVERED MATERIAL
            </div>

            <div class="document-id">
                RECORD 001
            </div>

        </header>


        <section class="document">

            <div class="document-image-container">
                <img src="../assets/see-dad.webp" alt="A handwritten note reading 'off to see my dad'"
                    class="document-image">
            </div>

        </section>


        <section class="metadata">

            <div class="metadata-row">
                <span class="label">AUTHOR</span>
                <span class="value">PRESUMED TO BE DYRA</span>
            </div>

            <div class="metadata-row">
                <span class="label">DATE</span>
                <span class="value">SEPT. 13TH, 430 AO</span>
            </div>

            <div class="metadata-row">
                <span class="label">LOCATION</span>
                <span class="value">AVILAN</span>
            </div>

            <div class="metadata-row">
                <span class="label">CONDITION</span>
                <span class="value">MOSTLY INTACT</span>
            </div>

            <div class="metadata-row">
                <span class="label">INK</span>
                <span class="value">UNIDENTIFIED</span>
            </div>

        </section>


        <footer class="document-footer">

            <span>ARCHIVAL SYSTEM</span>

            <span>RECORD 001</span>

        </footer>

    </main>

</body>

</html>
