<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211e1a">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Breaking the Axis</title>

    <!-- Website favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- Web app manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- iPhone / iPad Home Screen settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Axis Chronicles">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Home Screen icon -->
    <link rel="apple-touch-icon" href="assets/images/app-icon-180.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="topbar-logo">✦</span>
                <span>BREAKING THE AXIS</span>
            </div>

            <span class="header-label">CAMPAIGN JOURNAL</span>
        </header>

        <div class="layout">
            <aside class="sidebar" aria-label="Campaign journal navigation">
                <div class="sidebar-heading">JOURNAL</div>

                <button class="nav-item active" data-page="quests">
                    <span>▤</span> Quests
                </button>

                <button class="nav-item" data-page="calendar">
                    <span>□</span> Calendar
                </button>

                <button class="nav-item" data-page="map">
                    <span>⌖</span> Map
                </button>

                <button type="button" class="nav-item" data-page="music">
                    <span>♫</span> Music
                </button>
            </aside>

            <main id="main-content" class="main-content">
                <div class="page-heading">
                    <div class="eyebrow">THE ADVENTURER'S JOURNAL</div>

                    <h1>The Axis Chronicles</h1>

                    <p>
                        A record of the trials, discoveries,
                        and deeds of the daring adventurers of
                        Caelora.
                    </p>
                </div>

                <div id="content">
                    <p class="loading">Fetching chronicles...</p>
                </div>
            </main>
        </div>
    </div>

    <script src="js/quests.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/map.js"></script>
    <script src="js/music.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
