<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211e1a">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Breaking the Axis | Axis Chronicles</title>

    <!-- Primary metadata -->
    <meta name="description"
        content="Explore the world of Caelora in Breaking the Axis. Follow the quests, discover its characters, and uncover the story of a twisted world caught between gods and mortals.">
    <link rel="canonical" href="https://slickfrommars.github.io/axis-chronicles/">

    <!-- Open Graph / Discord Embed -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Axis Chronicles">
    <meta property="og:title" content="Breaking the Axis | Axis Chronicles">
    <meta property="og:description"
        content="A world shaped by gods, fractured by fate, and changed by the choices of its heroes. Explore the campaign, its characters, and its unfolding quests.">
    <meta property="og:url" content="https://slickfrommars.github.io/axis-chronicles/">
    <meta property="og:image"
        content="https://slickfrommars.github.io/axis-chronicles/assets/images/discord-preview.png">
    <meta property="og:image:secure_url"
        content="https://slickfrommars.github.io/axis-chronicles/assets/images/discord-preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Breaking the Axis — an epic fantasy campaign in the world of Caelora">

    <!-- Discord / Twitter-compatible large preview -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Breaking the Axis | Axis Chronicles">
    <meta name="twitter:description"
        content="Explore the world of Caelora, its characters, quests, and unfolding story.">
    <meta name="twitter:image"
        content="https://slickfrommars.github.io/axis-chronicles/assets/images/discord-preview.png">

    <!-- Website favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- Web app manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- iPhone / iPad Home Screen settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Axis Chronicles">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Home Screen icon -->
    <link rel="apple-touch-icon" href="assets/images/app-icon-180.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="topbar-logo">✦</span>
                <span>BREAKING THE AXIS</span>
            </div>

            <span class="header-label">CAMPAIGN JOURNAL</span>
        </header>

        <div class="layout">
            <aside class="sidebar" aria-label="Campaign journal navigation">
                <div class="sidebar-heading">JOURNAL</div>

                <button class="nav-item active" data-page="quests">
                    <span>▤</span> Quests
                </button>

                <button type="button" class="nav-item" data-page="characters">
                    <span>♙</span> Characters
                </button>

                <button class="nav-item" data-page="map">
                    <span>⌖</span> Map
                </button>

                <button class="nav-item" data-page="calendar">
                    <span>□</span> Calendar
                </button>

                <button type="button" class="nav-item" data-page="music">
                    <span>♫</span> Music
                </button>
            </aside>

            <main id="main-content" class="main-content">
                <div class="page-heading">
                    <div class="eyebrow">THE ADVENTURER'S JOURNAL</div>

                    <h1>The Axis Chronicles</h1>

                    <p>
                        A record of the trials, discoveries,
                        and deeds of the daring adventurers of
                        Caelora.
                    </p>
                </div>

                <div id="content">
                    <p class="loading">Fetching chronicles...</p>
                </div>
            </main>
        </div>
    </div>

    <script src="js/quests.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/map.js"></script>
    <script src="js/music.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
